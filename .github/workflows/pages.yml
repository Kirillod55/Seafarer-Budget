name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['.github/keepalive']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # the Edge Function entries are outside tsc (npm: imports, Deno globals)
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-lock supabase/functions/*/index.ts
      - run: npm run build
        env:
          BUILD_TARGET: pages
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # the bot runs the same _shared code as the app: it goes out with it. Skipped until the secret is set.
  functions:
    needs: build
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qvhernqypfbototyisfr
    steps:
      - uses: actions/checkout@v7
      - name: Deploy the Edge Functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo '::notice::SUPABASE_ACCESS_TOKEN is not set, functions not deployed'; exit 0; fi
          npx --yes supabase@2 functions deploy telegram-bot --no-verify-jwt --project-ref "$PROJECT_REF"
          npx --yes supabase@2 functions deploy keepalive --no-verify-jwt --project-ref "$PROJECT_REF"
          npx --yes supabase@2 functions deploy fx-rates --project-ref "$PROJECT_REF"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
