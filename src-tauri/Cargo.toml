[package]
name = "seafarer-budget"
version = "1.1.7"
description = "Seafarer Budget"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
# tauri::generate_context! embeds the plugins config (updater pubkey, endpoints) as serde_json values
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true