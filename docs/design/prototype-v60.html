*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--stage);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.app{position:relative;max-width:430px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:36px;overflow:clip;display:flex;flex-direction:column;min-height:800px}
@media (max-width:480px){body{padding-left:0;padding-right:0;padding-block:0}.app{border:0;border-radius:0;min-height:100dvh;max-width:none}}
.screen{flex:1;padding:16px 16px 20px;display:flex;flex-direction:column;gap:16px}
.num{font-variant-numeric:tabular-nums}
h1,.large{font-size:32px;font-weight:600;margin:0;letter-spacing:-.6px;line-height:1.1;text-wrap:balance}
h2{font-size:22px;font-weight:600;margin:0;letter-spacing:-.3px}
h3{font-size:17px;font-weight:600;margin:0}
p{margin:0;line-height:1.45}
.label{color:var(--muted);font-size:13px}
.small{font-size:15px}
.muted{color:var(--muted)}
.section{color:var(--muted);font-size:13px;font-weight:500;padding:4px 16px 0;margin-bottom:-6px}
/* top bars */
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:44px;margin-top:calc(10px + env(safe-area-inset-top,0px))}
.topbar .right{display:flex;align-items:center;gap:6px}
/* date = a Liquid Glass pill like the nav buttons (navbtn), with room between text and calendar icon */
.navbtn.datebtn{gap:7px;white-space:nowrap;padding:0 13px}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;border-radius:22px;color:var(--accent-text);cursor:pointer;padding:0}
.iconbtn svg{width:26px;height:26px}
.iconbtn.err{color:var(--danger)}
.syncind{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;color:var(--accent-text);transition:color .35s var(--ios)}.syncind svg{width:26px;height:26px;overflow:visible}.syncind.err{color:var(--danger)}
.syncind .bd{transform-box:view-box;transform-origin:18px 18px;transition:opacity .3s var(--ios),transform .45s var(--spring)}
.syncind .b-sync,.syncind .b-err,.syncind.err .b-ok,.syncind.syncing .b-ok,.syncind.syncing .b-err{opacity:0;transform:scale(.4)}
.syncind.err .b-err,.syncind.syncing .b-sync{opacity:1;transform:scale(1)}
.syncind.syncing{color:var(--accent-text)}
.syncind .spinr{transform-box:view-box;transform-origin:18px 18px}
.syncind.syncing .spinr{animation:spin .9s linear infinite}
.syncind.pop .b-ok{animation:popIn .5s var(--spring)}
@keyframes popIn{from{opacity:0;transform:scale(.3)}}
.addbtn{width:36px;height:36px;border-radius:18px;background:var(--accent);color:var(--on-accent);border:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;margin-left:4px}
.addbtn svg{width:20px;height:20px}
.navbar{display:flex;justify-content:space-between;align-items:center;min-height:44px;margin:0 -6px}
.navback,.navbtn{display:inline-flex;align-items:center;gap:2px;background:none;border:0;min-height:44px;padding:0 6px;color:var(--accent-text);font:inherit;font-size:17px;cursor:pointer}
.navback svg{width:24px;height:24px;margin-left:-6px}
.navbtn.strong{font-weight:600}
.syncinfo{font-size:13px;color:var(--danger);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
/* hero */
.balance{font-size:44px;font-weight:600;letter-spacing:-1.2px;line-height:1.1}
.bal-label{margin-bottom:6px}
.stats{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:14px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat:nth-child(2){align-items:center}.stat:nth-child(3){align-items:flex-end}
.stat .v{font-size:15px;font-weight:600;white-space:nowrap}
.board{display:inline-flex;align-items:center;gap:4px}
.anchor{width:15px;height:15px;color:var(--anchor);flex:none}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rowc{display:flex;justify-content:space-between;align-items:center;gap:10px}
.spent{font-size:28px;font-weight:600;letter-spacing:-.5px}
.limit{font-size:20px;font-weight:600;color:var(--accent-text)}
.bar{height:8px;border-radius:4px;background:var(--track);margin:12px 0 10px;overflow:hidden}
.bar.thin{height:6px;margin:8px 0 0}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .8s var(--ios)}
.bar.over>i{background:var(--warn)}.bar.warn>i{background:#F5B83D}
.left{color:var(--accent-text);font-weight:500}.over-text{color:var(--warn);font-weight:500}
.note{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.45}
.note.danger{color:var(--danger)}
/* inputs */
input,select{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font:inherit;font-size:17px;width:100%;min-width:0;min-height:48px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.quick{display:flex;gap:8px}
.quick input{border-radius:16px}
.quick>button{flex:none;white-space:nowrap}
.btn-acc{border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:600;padding:12px 18px;min-height:48px;min-width:48px;cursor:pointer}
.btn-acc svg{width:22px;height:22px}
.btn-gray{border:0;border-radius:14px;background:var(--track);color:var(--text);font:inherit;font-size:15px;font-weight:500;padding:12px 16px;min-height:44px;cursor:pointer}
.btn-gray.danger{color:var(--danger)}
.btn-tint{border:0;border-radius:14px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-text);font:inherit;font-size:15px;font-weight:600;padding:12px 16px;min-height:44px;cursor:pointer;transition:transform .2s var(--ios)}.btn-tint:active{transform:scale(.96)}
.goalacts{gap:8px}.goalacts>button{white-space:nowrap;padding-left:14px;padding-right:14px}.goalacts>.btn-gray{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.goalacts>.btn-tint{flex:none}
.textbtn{background:none;border:0;color:var(--accent-text);font:inherit;font-size:15px;font-weight:500;cursor:pointer;min-height:44px;padding:0 4px}
.textbtn.danger{color:var(--danger)}
.menu .catpanel{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:2px 16px 14px 66px}
.menu .catpanel .label{width:100%}
.menu .catpanel+button::before,.menu .arow+.arow::before{content:"";position:absolute;top:0;left:66px;right:0;border-top:1px solid var(--line)}
.menu button[aria-expanded="true"] .chev{transform:rotate(90deg)}.menu .chev{transition:transform .3s var(--ios)}
.arow{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;min-height:60px}
.arow .nm{flex:1;min-width:0}.arow .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow{flex-wrap:wrap;row-gap:0}.arow .aacts{display:flex;gap:16px;flex-basis:100%;padding-left:52px;margin:-4px 0 -6px}
.menu .arow .aacts button,.menu .catpanel button{display:inline-flex;align-items:center;min-height:40px;padding:8px 12px;font-size:15px;font-weight:500;border-radius:12px}.menu .arow .aacts button::before,.menu .catpanel button::before{display:none}
.menu .arow .aacts .textbtn{background:none;color:var(--accent-text);padding:8px 0}.menu .arow .aacts .textbtn.danger{color:var(--danger)}
.menu .catpanel .btn-gray{background:var(--track);color:var(--text)}.menu .catpanel .btn-gray.danger{color:var(--danger)}
.swatches{display:grid;grid-template-columns:repeat(5,34px);justify-content:space-between;row-gap:12px}
.swatch{width:34px;height:34px;border-radius:50%;border:0;background:var(--c);cursor:pointer;position:relative;transition:transform .3s var(--spring)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c);transform:scale(1.06)}
.icgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.icgrid button{border:0;background:none;padding:0;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;cursor:pointer;transition:transform .3s var(--spring)}
.icgrid button .ic{transition:box-shadow .2s var(--ios)}
.icgrid button[aria-pressed="true"] .ic{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
.icgrid button:active,.swatch:active{transform:scale(.9)}
.catprev{display:flex;align-items:center;gap:12px;font-size:17px}
.tx.crow{min-height:62px}.tx.crow .a{font-size:15px;font-weight:400}.tx.crow.fixed{cursor:default}
button:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.quickwrap .hint{font-size:13px;color:var(--muted);max-height:0;opacity:0;overflow:hidden;transition:max-height .35s var(--ios),opacity .25s,margin .35s var(--ios);margin-top:0}
.quickwrap:focus-within .hint,.quickwrap .hint.show{max-height:60px;opacity:1;margin-top:8px}
.quickwrap .hint.err{color:var(--warn)}
/* grouped list with swipe */
.group{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.swipe{position:relative;overflow:hidden}
.acts{position:absolute;inset:0 0 0 auto;display:flex;visibility:hidden}
.swipe.swiping .acts{visibility:visible}
.act{border:0;width:84px;font:inherit;font-size:15px;font-weight:500;color:#fff;cursor:pointer}
.act.edit{background:var(--act-edit)}.act.del{background:var(--act-del);flex:1}
.act.edit{flex:none;overflow:hidden;white-space:nowrap;transition:width .2s var(--ios),padding .2s var(--ios)}.swipe.full .act.edit{width:0;padding:0}
.tx{position:relative;display:flex;align-items:center;gap:12px;padding:11px 16px;width:100%;background:var(--card);border:0;text-align:left;color:inherit;font:inherit;cursor:pointer;touch-action:pan-y;transition:transform .35s var(--ios)}
.swipe+.swipe .tx::before{content:"";position:absolute;top:0;left:66px;right:0;border-top:1px solid var(--line)}
.tx .t{flex:1;min-width:0;display:flex;flex-direction:column}
.tx .t1{font-size:17px}
.tx .t2{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-size:17px;font-weight:600;text-align:right;white-space:nowrap}
.tx .a small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.tx .a.inc{color:var(--ok)}
/* who added: her records get her initial on the category icon and her name in the subtitle */
.icw{position:relative;display:inline-flex;flex:none}
.who{position:absolute;right:-5px;bottom:-5px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:var(--partner);color:var(--bg);font-size:11px;font-weight:700;line-height:19px;text-align:center;box-shadow:0 0 0 2px var(--card)}
.ic.sm+.who{right:-6px;bottom:-6px;min-width:16px;height:16px;line-height:16px;font-size:10px}
.whon{color:var(--text);font-weight:600}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--track);margin-top:12px}
.split i{display:block;height:100%;transition:width .6s var(--ios)}.split i.me{background:var(--accent)}.split i.her{background:var(--partner)}
.lgn{display:flex;flex-direction:column;min-width:0}.lgn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lgn .label{font-size:13px;white-space:nowrap}.lgn .label .whon{display:inline}
.splitrow{display:flex;justify-content:space-between;margin-top:8px;font-size:15px}
.splitrow .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tg{display:flex;flex-direction:column;gap:2px;text-align:left}.tg small{color:var(--muted);font-size:12px}
.ic{width:38px;height:38px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--track);color:var(--c,var(--muted));background:color-mix(in srgb,var(--c,#8E8E93) 17%,transparent)}
.ic svg{width:21px;height:21px}
.ic.sm{width:26px;height:26px;border-radius:8px}.ic.sm svg{width:15px;height:15px}
/* tabs */
.tabs{position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bar-bg);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6)}
.tab{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:11px;font-weight:500;min-height:48px;padding:4px 2px;cursor:pointer}
.tab[aria-current="page"]{color:var(--accent-text)}
.tab svg{width:26px;height:26px}
/* segmented */
.field{display:flex;flex-direction:column;gap:6px}.field label,.flabel{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:10px}
.seg{position:relative;display:flex;background:var(--track);border-radius:12px;padding:3px;gap:0}
.seg button{position:relative;z-index:1;flex:1;border:0;background:transparent;color:var(--muted);border-radius:9px;min-height:38px;padding:6px 4px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--on-accent);font-weight:600}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:0;border-radius:9px;background:var(--accent);z-index:0;transition:transform .45s var(--ios),width .45s var(--ios);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 14px 6px 6px;min-height:44px;font:inherit;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip[aria-pressed="true"] .ic{background:rgba(17,20,10,.12);color:var(--on-accent)}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 16px;min-height:44px;font-size:15px}
.tag.has-x{padding-right:4px}
.tag .x{width:36px;height:36px;border-radius:18px;border:0;background:var(--track);color:var(--muted);font-size:15px;cursor:pointer}
.calc{font-size:15px;color:var(--muted)}.calc b{color:var(--accent-text);font-weight:600}
.menu{display:flex;flex-direction:column;padding:0}
.menu button{display:flex;align-items:center;gap:12px;background:none;border:0;padding:11px 16px;min-height:56px;color:var(--text);font:inherit;font-size:17px;text-align:left;cursor:pointer;position:relative}
.menu button+button::before{content:"";position:absolute;top:0;left:66px;right:0;border-top:1px solid var(--line)}
.menu .chev{margin-left:auto;color:var(--muted);display:inline-flex}.menu .chev svg{width:18px;height:18px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{text-align:center;font-size:12px;color:var(--muted);padding-bottom:2px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;cursor:pointer;padding:4px 0}
.day .dn{font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:2px}.day .dv{font-size:12px;color:var(--muted)}
.day.today{border-color:var(--accent-text)}.day.sel{background:var(--accent);border-color:var(--accent)}

.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;z-index:41;padding:6px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:sheetUp .5s var(--ios);box-shadow:0 -10px 40px rgba(0,0,0,.25)}

.picker{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;min-height:48px;padding:12px 10px 12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit;font-size:17px;cursor:pointer;text-align:left}

.acards{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px -14px;padding:2px 16px 24px;scroll-padding-left:16px;scrollbar-width:none}
.acards::-webkit-scrollbar{display:none}
.acard{position:relative;flex:0 0 80%;scroll-snap-align:start;border-radius:22px;padding:16px;min-height:156px;color:#fff;display:flex;flex-direction:column;gap:8px;overflow:hidden;
  background:linear-gradient(135deg,var(--c) 0%,color-mix(in srgb,var(--c) 62%,#05060a) 100%);box-shadow:0 12px 28px color-mix(in srgb,var(--c) 28%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}

.acard-ic{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}.acard-ic svg{width:18px;height:18px}
.acard-badge{margin-left:auto;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.24)}
.acard-bal{position:relative;z-index:1;font-size:30px;font-weight:700;letter-spacing:-.6px;margin-top:auto}

.acard.add{background:none;border:1.5px dashed var(--line);color:var(--muted);box-shadow:none;align-items:center;justify-content:center;cursor:pointer;font:inherit;font-weight:500}
.acard.add::before,.acard.add::after{display:none}.acard.add svg{width:26px;height:26px}
.acard.add:hover{color:var(--text);border-color:var(--muted)}
.xrate{font-size:14px;color:var(--muted)}.xrate b{color:var(--text)}

html.desk body{font-size:14px}

html.desk ::-webkit-scrollbar{width:12px;height:12px}html.desk ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:3px solid var(--bg)}html.desk ::-webkit-scrollbar-track{background:transparent}
/* sidebar = NavigationView: a small accent bar marks the page */
html.desk .side{background:color-mix(in srgb,var(--track) 45%,var(--bg))}

html.desk .side .si[aria-current="page"] svg{color:var(--accent-text)}
html.desk .side .si[aria-current="page"]::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:2px;background:var(--accent-text)}
/* page header: title left, actions right (no phone-style nav pills) */
.dhead{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:40px}
.dtitle{display:flex;align-items:baseline;gap:10px;min-width:0}
.dhead h1{font-size:28px;font-weight:600;letter-spacing:-.4px;margin:0;white-space:nowrap}

.dact{display:flex;gap:8px;flex:none}
.fbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;font-weight:500;cursor:pointer;box-shadow:0 1px 0 color-mix(in srgb,var(--text) 6%,transparent);transition:background-color .15s}
.fbtn:hover{background:var(--track)}.fbtn:active{transform:none;opacity:.85}
.fbtn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}.fbtn.primary:hover{filter:brightness(.96);background:var(--accent)}
.fbtn svg{width:16px!important;height:16px!important;margin:0!important}
.fbtn::before,.fbtn::after{display:none!important}
/* buttons that are glass pills on the phone become plain Windows buttons */
html.desk .navbtn.datebtn{background:var(--card);border:1px solid var(--line);border-radius:6px;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;height:34px;font-size:14px}

html.desk .addbtn{border-radius:6px;box-shadow:none}

html.desk .sheetnav .navbtn.strong{background:var(--accent);color:var(--on-accent);border-color:transparent}
html.desk .sheet{background:var(--bg)}
/* tables */
.dtable{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:14px}
.dtable th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--track) 55%,var(--card));white-space:nowrap}

.dtable tbody tr:hover td{background:color-mix(in srgb,var(--text) 3%,var(--card))}
.dtable .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.dtable tr:hover .ract .hb,.dtable tr:focus-within .ract .hb{opacity:1}
.dtable .ract .fbtn{height:30px;padding:0 10px}
.dtable .confrow td{background:color-mix(in srgb,var(--danger) 6%,var(--card))!important}

.tbar{height:6px;border-radius:3px;background:var(--track);overflow:hidden;min-width:110px}.tbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.tbar.warn i{background:#F5B83D}.tbar.over i{background:var(--danger)}
.tsec{font-size:14px;font-weight:600;margin:10px 0 -6px}
html.desk .tag{border-radius:6px}html.desk .tag .x{border-radius:4px}
/* settings = Windows Settings rows */
.sgroup{display:flex;flex-direction:column;gap:3px}

.srow{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 16px;min-height:62px}

.srow .sctl .picker{width:190px}

/* one page transition for every section on PC */
.screen.v-desk{animation:vDesk .28s cubic-bezier(.2,.8,.2,1)}
@keyframes vDesk{from{opacity:0;transform:translateY(8px)}}
/* PC only: the sync cloud is a button with a small flyout */
html.desk .syncind{cursor:pointer;border-radius:8px;transition:background-color .15s}
html.desk .syncind:hover,html.desk .syncind[aria-expanded="true"]{background:var(--track)}
html.desk .syncind:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.syncfly{position:fixed;z-index:61;width:300px;padding:14px;border-radius:8px;display:flex;flex-direction:column;gap:10px;animation:flyIn .22s cubic-bezier(.2,.8,.2,1)}
.syncfly .sf-head{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;position:relative}

.syncfly.err .sf-dot{background:var(--danger)}.syncfly.busy .sf-dot{background:var(--accent-text);animation:sfPulse 1s ease-in-out infinite}

.syncfly .fbtn[disabled]{opacity:.6;cursor:default}
@keyframes flyIn{from{opacity:0;transform:translateY(-6px)}}
@keyframes sfPulse{50%{opacity:.35}}
/* PC: no liquid glass anywhere — solid Windows 11 surfaces (flyouts, menus, buttons, notifications) */
html.desk{--fly-shadow:0 8px 28px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.06)}
@media (prefers-color-scheme: dark){html.desk:not([data-app-theme="light"]){--fly-shadow:0 10px 32px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3)}}
html.desk[data-app-theme="dark"]{--fly-shadow:0 10px 32px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3)}
html.desk .glass,html.desk .toast{background:var(--card)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border:1px solid var(--line)!important;box-shadow:var(--fly-shadow)!important}
html.desk .glass::before,html.desk .glass::after{display:none}
html.desk .glass{animation:flyIn .16s cubic-bezier(.2,.8,.2,1)}

html.desk .glass .ic{background:color-mix(in srgb,var(--c,#8E8E93) 17%,transparent);color:var(--c,var(--muted));box-shadow:none}

html.desk .navback,html.desk .navbtn,html.desk .iconbtn.glassy{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none;border:1px solid var(--line);box-shadow:none;border-radius:6px}
html.desk .navback::before,html.desk .navbtn::before,html.desk .iconbtn.glassy::before{display:none}
html.desk .navback:hover,html.desk .navbtn:hover,html.desk .iconbtn.glassy:hover{background:var(--track)}
html.desk .addbtn{box-shadow:none}html.desk .addbtn::before,html.desk .addbtn::after{display:none}
/* report tiles that open things */

.rlink:hover{background:color-mix(in srgb,var(--text) 4%,var(--card))}

html.desk .hov{padding-left:28px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--text) 4%,var(--card)) 26px)}
/* PC: the record opens as a dialog in the middle of the window — nothing behind it moves */
html.desk .backdrop{background:rgba(0,0,0,.42);pointer-events:auto}
html.desk .sheet{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 48px));max-height:min(86vh,840px);border-radius:8px;border:1px solid var(--line);background:var(--card);box-shadow:0 24px 64px rgba(0,0,0,.35);animation:dlgIn .2s cubic-bezier(.2,.8,.2,1);padding:18px 22px 22px}

.tx.crow.fixed[role="button"]{cursor:pointer}

function budget(){

  const netToday=S.tx.filter(t=>t.d===S.today).reduce((a,t)=>a+sign(t),0);
  const goalsSaved=S.goals.filter(g=>!g.archived).reduce((a,g)=>a+g.saved,0);
  const morning=S.start-before,balance=morning-netToday,free=morning-S.reserve-goalsSaved;
  const r={balance,morning,free,spentToday,freeNow:balance-S.reserve-goalsSaved};
  if(!S.boarding)return {...r,state:'nodate'};
  const days=dayDiff(S.today,S.boarding)+1;

}

const ALIAS={};
const CUR_ALIASES={UAH:['грн','гр','гривна','гривны','гривен','гривень','uah','grn','gr','hrn','hryvnia','₴'],USD:['usd','us','$','дол','долл','доллар','доллара','долларов','бакс','бакса','баксов','dol','dollar','dollars'],EUR:['eur','eu','€','евро','евр','euro','evro'],MDL:['лей','леев','лея','леи','lei','mdl','ley']};
for(const [c,list] of Object.entries(CUR_ALIASES))for(const a of list)ALIAS[a]=c;
const CUR_NAME={UAH:'гривны',USD:'доллары',EUR:'евро',MDL:'леи'};
const TR={a:'а',b:'б',v:'в',g:'г',d:'д',e:'е',z:'з',i:'и',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',r:'р',s:'с',t:'т',u:'у',f:'ф',h:'х',c:'ц',y:'й'};
const KB_EN="qwertyuiop[]asdfghjkl;'zxcvbnm,.",KB_RU='йцукенгшщзхъфывапролджэячсмитьбю';
const translit=s=>[...s].map(ch=>TR[ch]||ch).join('');
const swapLayout=s=>[...s].map(ch=>{let i=KB_EN.indexOf(ch);if(i>=0)return KB_RU[i];i=KB_RU.indexOf(ch);return i>=0?KB_EN[i]:ch}).join('');
function dist(a,b){const d=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length).fill(0)]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[a.length][b.length]}
function curOf(tk,adjacent){
  if(ALIAS[tk])return {c:ALIAS[tk],fix:false};
  if(!adjacent)return null;
  if(tk==='l')return {c:'MDL',fix:false};
  const variants=[translit(tk),swapLayout(tk)];
  for(const v of variants)if(ALIAS[v])return {c:ALIAS[v],fix:true};
  if(tk.length<3)return null;
  let best=null;for(const v of [tk,...variants])for(const a in ALIAS){if(a.length<3)continue;const dd=dist(v,a);if(dd<=1&&(!best||dd<best.d))best={c:ALIAS[a],d:dd}}
  return best?{c:best.c,fix:true}:null;
}
function parse(text){
  const raw=text.trim();if(!raw)return {err:'Напиши трату, например «кофе 80»'};
  const tokens=raw.replace(/([\d])([^\d\s.,])/g,'$1 $2').replace(/([$€₴])(\d)/g,'$1 $2').split(/\s+/);
  let inc=false;
  const orig=tokens.map(t=>{t=t.replace(/[.,!?;:]+$/,'');if(t.startsWith('+')){inc=true;t=t.slice(1)}return t});
  const toks=orig.map(t=>t.toLowerCase());
  const ai=toks.findIndex(t=>/^\d+([.,]\d{1,2})?$/.test(t));
  const amt=ai<0?null:parseFloat(toks[ai].replace(',','.'));
  let cur=S.defCur,curSet=false,fixed=null,words=[];
  toks.forEach((tk,i)=>{if(i===ai||!tk)return;
    if(!curSet){const r=curOf(tk,ai>=0&&Math.abs(i-ai)===1);if(r&&S.currencies.includes(r.c)){cur=r.c;curSet=true;if(r.fix)fixed=orig[i];return}}
    words.push(orig[i])});
  if(!amt||amt<=0)return {err:'Не нашёл сумму. Пример: «такси 15 eur»'};
  let cat=null;
  outer:for(const w of words)for(const [n,kw] of Object.entries(KW))if(kw.some(k=>w.toLowerCase().startsWith(k))){cat=n;break outer}
  if(cat&&catOf(cat).kind==='income')inc=true;
  if(!cat)cat=inc?'Зарплата':'Прочее';
  return {amt,cur,cat,note:cap(words.join(' ')),kind:inc?'income':'expense',fixed};
}

function calendar(){

/* picking a day changes only the highlight and the block below — the page itself is not redrawn */
function pickDay(ds,cell){const box=document.getElementById('calDay'),prev=S.calDay||S.today;S.calDay=ds;save();
  if(!box){render();return}
  document.querySelectorAll('#screen .day.sel').forEach(d=>d.classList.remove('sel','pick'));cell.classList.add('sel');
  if(!RM){cell.classList.remove('pick');void cell.offsetWidth;cell.classList.add('pick')}
  if(box._fin)box._fin();
  const cur=box.querySelector('.cdin:not(.cdold)'),nw=document.createElement('div');nw.className='cdin';nw.innerHTML=dayBlock(ds).replace(/font-size:(d+(?:.d+)?)px/g,'font-size:calc($1px*var(--ts,1))');
  if(RM||!cur){box.innerHTML='';box.append(nw);bind();return}
  const dir=ds>prev?1:-1,h0=box.offsetHeight;
  cur.classList.add('cdold');cur.removeAttribute('id');cur.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
  box.append(nw);const h1=nw.offsetHeight;
  const ease='cubic-bezier(.2,.8,.2,1)',anims=[
    box.animate([{height:h0+'px'},{height:h1+'px'}],{duration:320,easing:ease}),
    cur.animate([{opacity:1,transform:'none'},{opacity:0,transform:`translateX(${-dir*18}px)`}],{duration:170,easing:'ease-in',fill:'forwards'}),
    nw.animate([{opacity:0,transform:`translateX(${dir*22}px)`},{opacity:1,transform:'none'}],{duration:320,delay:50,easing:ease,fill:'backwards'})];
  box.classList.add('swapping');
  box._fin=()=>{box._fin=null;anims.forEach(a=>a.cancel());cur.remove();box.classList.remove('swapping')};
  const fin=box._fin;anims[0].onfinish=()=>{if(box._fin===fin)fin()};setTimeout(()=>{if(box._fin===fin)fin()},420);
  bind()}

  if(S.desk&&!editId)setTimeout(()=>{const a=document.getElementById('r-amt');if(a)a.focus({preventScroll:true})},60)}
function sheetDone(after){const back=S.editId;S.sheet=false;S.form=null;S.editId=null;S.confirmDel=false;if(after)after();save();render();
  /* keyboard focus must come back into the app after the panel goes away (else N, arrows, Delete stop working) */
  if(S.desk){try{window.focus()}catch(_){}const el=(back&&document.querySelector(`#screen .tx[data-open="${back}"]`))||document.querySelector('#screen [data-new]');if(el)el.focus({preventScroll:true})}}
function closeSheet(after){const sh=document.getElementById('sheet'),bd=document.getElementById('backdrop');
  if(!S.sheet||(sh&&(sh.classList.contains('closing')||sh.dataset.dragclose)))return;
  if(!sh||RM)return sheetDone(after);
  if(sh._sp){sh._sp.stop();sh._sp=null}
  if(sh.dataset.dragged){sh.style.animation='none';sh.style.transition='transform .3s var(--ios)';sh.style.transform='translate(-50%,100%)';sh.classList.add('closing')}
  else{sh.style.transition='';sh.style.transform='';sh.classList.add('closing')}
  bd.classList.add('closing');setTimeout(()=>sheetDone(after),300)}
function bindSheetDrag(){const sh=document.getElementById('sheet'),bd=document.getElementById('backdrop');if(!sh||S.desk)return;
  let y0=null,x0=0,dy=0,mode=null;const tr=tracker();sh._y=sh._y||0;
  const place=y=>{sh._y=y;sh.style.transform='translate(-50%,'+y+'px)';bd.style.opacity=String(Math.max(.15,1-Math.max(0,y)/sh.offsetHeight))};
  const start=(x,y)=>{if(sh.classList.contains('closing')||document.getElementById('glassMenu'))return;tr.reset();tr.add(y);
    if(sh._sp){/* caught mid-flight: keep following from where it is */sh._sp.stop();sh._sp=null;delete sh.dataset.dragclose;mode='drag';y0=y-sh._y;x0=x;dy=Math.max(0,sh._y);sh.classList.add('dragging');return}
    y0=y;x0=x;dy=0;mode=null};
  const move=(x,y,e)=>{if(y0===null)return;
    if(mode===null){const ddy=y-y0,ddx=x-x0;if(Math.abs(ddy)<8&&Math.abs(ddx)<8)return;
      /* only a downward, mostly vertical pull while the sheet is scrolled to its top closes it */
      mode=ddy>0&&Math.abs(ddy)>Math.abs(ddx)&&sh.scrollTop<=0?'drag':'none';
      if(mode==='drag'){y0=y;sh.dataset.dragged='1';sh.style.animation='none';sh.style.transition='none';bd.style.transition='none';bd.style.animation='none';sh.classList.add('dragging');
        const ae=document.activeElement;if(ae&&sh.contains(ae)&&ae.blur)ae.blur()}}
    if(mode!=='drag')return;if(e.cancelable)e.preventDefault();tr.add(y);
    const raw=y-y0;dy=Math.max(0,raw);place(raw<0?-rubber(-raw,sh.offsetHeight):raw)};
  const end=()=>{if(y0===null)return;const was=mode;y0=null;mode=null;if(was!=='drag')return;sh.classList.remove('dragging');
    /* a drag must not also count as a tap on the button under the finger */
    const block=ev=>{ev.stopPropagation();ev.preventDefault()};sh.addEventListener('click',block,true);setTimeout(()=>sh.removeEventListener('click',block,true),60);
    const v=tr.v(),H=sh.offsetHeight,rest=sh._y+project(v);
    if(v>-150&&(rest>H*.4||sh._y>Math.min(140,H*.28))){sh.dataset.dragclose='1';
      sh._sp=spring({from:sh._y,to:H+30,v,damping:1,response:.32,onUpdate:place,onDone:()=>{sh._sp=null;sh._y=0;sheetDone()}})}
    else sh._sp=spring({from:sh._y,to:0,v,damping:.8,response:.3,onUpdate:place,onDone:()=>{sh._sp=null;bd.style.opacity='';delete sh.dataset.dragged}})};
  sh.ontouchstart=e=>{if(e.touches.length===1)start(e.touches[0].clientX,e.touches[0].clientY)};
  sh.ontouchmove=e=>move(e.touches[0].clientX,e.touches[0].clientY,e);sh.ontouchend=sh.ontouchcancel=end;
  sh.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button===0)start(e.clientX,e.clientY)};
  sh.onpointermove=e=>{if(e.pointerType==='mouse')move(e.clientX,e.clientY,e)};
  window.onpointerup=e=>{if(e.pointerType==='mouse')end()};
}

/* swipe actions on transaction rows */
/* springs in Apple's terms (damping ratio + response, seconds). They start from the live on-screen value with the
   finger's speed (px/s) and can be stopped on any frame, so every gesture can be caught again mid-flight. */
function spring({from,to,v=0,damping=1,response=.35,onUpdate,onDone}){
  if(RM){queueMicrotask(()=>{onUpdate(to);if(onDone)onDone()});return {stop(){},value:()=>to}}
  const k=Math.pow(2*Math.PI/response,2),c=4*Math.PI*damping/response;let x=from,vel=v,last=performance.now(),id=0,stopped=false;
  const step=now=>{if(stopped)return;const dt=Math.min(.064,(now-last)/1000);last=now;const n=Math.max(1,Math.ceil(dt/.004)),h=dt/n;
    for(let i=0;i<n;i++){const a=-k*(x-to)-c*vel;vel+=a*h;x+=vel*h}
    if(Math.abs(x-to)<.4&&Math.abs(vel)<10){x=to;onUpdate(x);stopped=true;if(onDone)onDone();return}
    onUpdate(x);id=requestAnimationFrame(step)};
  id=requestAnimationFrame(step);
  return {stop(){stopped=true;cancelAnimationFrame(id)},value:()=>x};
}
/* where a flick would come to rest (Apple's projection, d = deceleration rate) */
const project=(v,d=.998)=>(v/1000)*d/(1-d);
/* soft resistance past a boundary */
const rubber=(over,dim,c=.55)=>(over*dim*c)/(dim+c*Math.abs(over));
/* finger speed in px/s from the last ~80 ms of samples */
const tracker=()=>{let pts=[];return {add(p){const t=performance.now();pts.push([p,t]);while(pts.length>2&&t-pts[0][1]>80)pts.shift()},
  v(){if(pts.length<2)return 0;const [p0,t0]=pts[0],[p1,t1]=pts[pts.length-1];return t1>t0?(p1-p0)/(t1-t0)*1000:0},reset(){pts=[]}}};

    if(S.desk){el.onclick=()=>{if(el.dataset.open)openSheet(el.dataset.open);else if(el.dataset.crow)openRecords(el.dataset.crow,'cats')};return}
    let x0=null,y0=0,drag=false,base=0;const tr=tracker(),row=el.parentElement,acts=row.querySelector('.acts'),N=acts?acts.children.length:2,OPEN=N*(N>2?74:84);
    const W=()=>row.offsetWidth;el._x=el._x||0;
    const place=x=>{el._x=x;el.style.transform='translateX('+x+'px)';if(acts)acts.style.width=Math.max(OPEN,-x)+'px'};
    el.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;drag=false;tr.reset();tr.add(e.clientX);
      if(el._sp){el._sp.stop();el._sp=null}base=el._x||(openRow===el?-OPEN:0)});
    el.addEventListener('pointermove',e=>{if(x0===null)return;const mx=e.clientX-x0,my=e.clientY-y0;tr.add(e.clientX);
      if(!drag&&Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)){drag=true;try{el.setPointerCapture(e.pointerId)}catch(_){}el.style.transition='none';row.classList.add('swiping');if(openRow&&openRow!==el)closeRow()}

function deleteCat(name){const i=S.cats.findIndex(c=>c.name===name);if(i<0)return;const c=S.cats[i],to=c.kind==='income'?'Прочий доход':'Прочее';

/* swipe right = back (wherever the screen has a «‹ back» button) */
function bindBackSwipe(){const scr=document.getElementById('screen');

  const back=scr.querySelector('.navbar [data-back]');if(!back||S.sheet||S.desk)return;
  const to=back.dataset.back;let x0=null,y0=0,dx=0,mode=null,under=null,W=0,sp=null;const tr=tracker();
  const place=x=>{dx=x;const p=Math.max(0,Math.min(1,x/W));scr.style.transform='translateX('+x+'px)';if(under){under.style.transform='translateX('+(-30+30*p)+'%)';under.style.setProperty('--dim',String(.18*(1-p)))}};
  const start=e=>{if(S.sheet||document.getElementById('glassMenu')||e.touches.length!==1)return;const t=e.touches[0];tr.reset();tr.add(t.clientX);
    if(sp){/* caught mid-flight */sp.stop();sp=null;mode='back';x0=t.clientX-dx;y0=t.clientY;return}
    const edge=t.clientX<28;if(!edge&&e.target.closest('.swipe,input,select,textarea,.seg,.icgrid,.swatches'))return;
    x0=t.clientX;y0=t.clientY;dx=0;mode=null};
  const move=e=>{if(x0===null)return;const t=e.touches[0],mx=t.clientX-x0,my=t.clientY-y0;
    if(mode===null){if(Math.abs(mx)<10&&Math.abs(my)<10)return;mode=mx>0&&Math.abs(mx)>Math.abs(my)*1.2?'back':'none';
      if(mode==='back'){closeRow&&closeRow();W=scr.getBoundingClientRect().width;const r=document.querySelector('.app').getBoundingClientRect();
        under=document.createElement('div');under.className='under';under.style.left=r.left+'px';under.style.width=r.width+'px';
        under.innerHTML='<section class="screen">'+VIEWS[to]().replace(/\sid="[^"]*"/g,'')+'</section>';document.body.append(under);
        scr.classList.add('backdrag');scr.style.transition='none';under.style.transition='none';x0=t.clientX}}
    if(mode!=='back')return;if(e.cancelable)e.preventDefault();tr.add(t.clientX);
    const raw=t.clientX-x0;place(raw<0?-rubber(-raw,W):raw)};
  const end=()=>{if(x0===null)return;x0=null;if(mode!=='back'){mode=null;return}mode=null;
    const v=tr.v(),commit=v>-100&&dx+project(v)>W*.5;
    sp=spring({from:dx,to:commit?W:0,v,damping:1,response:.33,onUpdate:place,onDone:()=>{sp=null;const u=under;under=null;
      if(commit){scr.classList.remove('backdrag');scr.style.transition='none';scr.style.transform='';NOANIM=true;go(to);NOANIM=false;window.scrollTo(0,0);if(u)u.remove();void scr.offsetWidth;scr.style.transition=''}
      else{scr.classList.remove('backdrag');scr.style.transform='';if(u)u.remove()}}})};

  scr.addEventListener('touchstart',start,{passive:true});scr.addEventListener('touchmove',move,{passive:false});scr.addEventListener('touchend',end);scr.addEventListener('touchcancel',end);

/* pull to refresh (home) */
function bindPull(){const scr=document.getElementById('screen'),ptr=S.desk?null:document.getElementById('ptr');
  if(!ptr){scr.ontouchstart=scr.ontouchmove=scr.ontouchend=scr.ontouchcancel=scr.onpointerdown=scr.onpointermove=scr.onpointerup=scr.onpointercancel=null;return}
  const pi=ptr.querySelector('.pi'),pr=ptr.querySelector('.pr'),tx=document.getElementById('ptrText'),TH=54;let y0=null,h=0,rot=0,armed=false;
  const start=(y,t)=>{if(pullBusy||window.scrollY>0||t.closest('input,.tx,.day,button,select'))return;y0=y;h=0;armed=false};
  const move=(y,e)=>{if(y0===null)return;const dy=y-y0;
    if(dy<=0){if(h){h=0;ptr.style.height='0px';pi.style.opacity='0'}return}
    if(e.cancelable)e.preventDefault();ptr.classList.add('dragging');
    h=100*(1-Math.exp(-dy/150));const p=Math.min(1,h/TH);rot=p*300;
    ptr.style.height=h+'px';pi.style.opacity=p;pi.style.transform='scale('+(.6+.4*p)+')';pr.style.transform='rotate('+rot+'deg)';
    const arm=h>=TH;if(arm!==armed){armed=arm;ptr.classList.toggle('armed',arm);tx.textContent=arm?'Отпусти — синхронизирую':'Потяни, чтобы синхронизировать';if(arm&&navigator.vibrate)navigator.vibrate(8)}};
  const end=()=>{if(y0===null)return;y0=null;ptr.classList.remove('dragging','armed');pi.style.opacity='';pi.style.transform='';
    if(armed&&h)runPull(ptr,pr,tx,rot);else{ptr.style.height='0px';pr.style.transform=''}};
  scr.ontouchstart=e=>start(e.touches[0].clientY,e.target);scr.ontouchmove=e=>move(e.touches[0].clientY,e);scr.ontouchend=scr.ontouchcancel=end;
  scr.onpointerdown=e=>{if(e.pointerType==='mouse')start(e.clientY,e.target)};scr.onpointermove=e=>{if(e.pointerType==='mouse')move(e.clientY,e)};scr.onpointerup=scr.onpointercancel=e=>{if(e.pointerType==='mouse')end()};
}
let pullBusy=false;

  if($('reset'))$('reset').onclick=()=>{const th=S.theme,nf=S.numFmt;S=JSON.parse(JSON.stringify(DEFAULT));S.theme=th;S.numFmt=nf;save();render()};
  /* sheet */
  if(S.sheet){const f=S.form;const sync=()=>{if(!$('r-amt'))return;f.amt=$('r-amt').value;f.cur=$('r-cur').value;f.d=$('r-date').value;f.note=$('r-note').value};
    ['r-amt','r-note'].forEach(id=>{const i=$(id);if(i)i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('r-save').click()}})});
    $('backdrop').onclick=()=>{if(!$('sheet')._sp)closeSheet()};$('r-cancel').onclick=()=>closeSheet();
    on('[data-kind]',el=>{if(f.kind===el.dataset.kind)return;sync();f.kind=el.dataset.kind;if(catOf(f.cat).kind!==f.kind)f.cat='';S.kindFlip=true;save();render()});
    on('[data-rwho]',el=>{sync();f.by=el.dataset.rwho;save();segSelect(el.parentElement,[...el.parentElement.querySelectorAll('button')].indexOf(el))});
    on('[data-cat]',el=>{sync();f.cat=el.dataset.cat;document.querySelectorAll('#r-chips .chip').forEach(c=>c.setAttribute('aria-pressed',String(c===el)));save()});
    $('r-save').onclick=()=>{sync();const a=parseFloat(String(f.amt).replace(',','.'));
      if(!(a>0)){$('r-err').textContent='Введите сумму';return} if(!f.d){$('r-err').textContent='Укажите дату';return}
      const rec={id:S.editId||nid(),kind:f.kind,amt:a,cur:f.cur,cat:f.cat||(f.kind==='income'?'Зарплата':'Прочее'),d:f.d,note:f.note,by:f.by||'me'};
      const isEdit=!!S.editId;closeSheet(()=>{if(isEdit)S.tx=S.tx.map(t=>t.id===rec.id?rec:t);else{S.tx.push(rec);S.lastAdded=rec.id}})};
    if($('r-del'))$('r-del').onclick=()=>{sync();S.confirmDel=true;save();render()};
    if($('r-nodel'))$('r-nodel').onclick=()=>{S.confirmDel=false;save();render()};
    if($('r-del2'))$('r-del2').onclick=()=>{const id=S.editId;closeSheet(()=>{setTimeout(()=>deleteTx(id,document.querySelector(`.swipe[data-id="${id}"]`)),50)})};
  }
  /* goals */
  on('[data-gnew]',()=>{S.goalNew=true;save();softRender()});on('[data-gcancel]',()=>{S.goalNew=false;save();softRender()});
  if($('g-save'))$('g-save').onclick=()=>{const n=$('g-name').value.trim(),t=parseFloat($('g-target').value);
    if(!n||!(t>0)){$('g-err').textContent='Укажи название и сумму цели';return}
    S.goals.push({id:nid(),name:n,target:t,saved:0,deadline:$('g-dl').value||null,archived:false});S.goalNew=false;save();render()};
  on('[data-gmove]',el=>{S.goalMove=el.dataset.gmove||null;save();softRender()});
  const move=(id,sgn)=>{const a=parseFloat(($('m-amt').value||'').replace(',','.'));if(!(a>0))return;const g=S.goals.find(x=>x.id===id);g.saved=Math.max(0,g.saved+sgn*a*RATES[$('m-cur').value]);S.goalMove=null;save();render()};
  on('[data-gput]',el=>move(el.dataset.gput,1));on('[data-gtake]',el=>move(el.dataset.gtake,-1));
  on('[data-garch]',el=>{S.goals.find(g=>g.id===el.dataset.garch).archived=true;save();softRender();toast('Цель в архиве')});
  /* limits */
  on('[data-lnew]',()=>{if(S.limNew){const a=$('l-amt');if(a)a.focus();return}S.limNew=true;save();softRender();setTimeout(()=>{const a=$('l-amt');if(a)a.focus({preventScroll:true})},60)});on('[data-lcancel]',()=>{S.limNew=false;save();softRender()});
  if($('l-save'))$('l-save').onclick=()=>{const a=parseFloat($('l-amt').value);if(a>0){S.limits[$('l-cat').value]=a;S.limNew=false;save();softRender()}};
  on('[data-ldel]',el=>{delete S.limits[el.dataset.ldel];save();softRender()});
  /* settings */
  const recalc=()=>{if($('calc'))$('calc').innerHTML=more().match(/<div class="calc" id="calc">([\s\S]*?)<\/div>/)[1]};
  const num=(id,key)=>{const el=$(id);if(el)el.addEventListener('input',()=>{const v=parseFloat(el.value);S[key]=isFinite(v)&&v>=0?v:0;save();recalc()})};
  num('f-start','start');num('f-res','reserve');
  if($('f-board'))$('f-board').addEventListener('change',()=>{S.boarding=$('f-board').value||null;save();recalc()});
  on('[data-theme-set]',el=>{S.theme=el.dataset.themeSet;save();applyTheme();segSelect(el.parentElement,[...el.parentElement.querySelectorAll('button')].indexOf(el))});
  on('[data-remind]',el=>{S.remindDays=+el.dataset.remind;save();segSelect(el.parentElement,[...el.parentElement.querySelectorAll('button')].indexOf(el));const box=el.closest('.card'),p=box&&box.querySelector('.label');if(p)p.innerHTML=p.innerHTML.replace(/не было [^,]*,/,'не было '+(S.remindDays?plural(S.remindDays,'день','дня','дней'):'—')+',')});
  on('[data-mode]',el=>{S.mode=el.dataset.mode;save();segSelect(el.parentElement,[...el.parentElement.querySelectorAll('button')].indexOf(el))});
  on('[data-curdel]',el=>{S.currencies=S.currencies.filter(c=>c!==el.dataset.curdel);save();softRender()});
  if($('c-def'))$('c-def').onchange=()=>{S.defCur=$('c-def').value;save();softRender()};
  if($('c-add'))$('c-add').onclick=()=>{const c=$('c-new').value.trim().toUpperCase();if(!/^[A-Z]{3}$/.test(c)){$('c-hint').textContent='Три латинские буквы, например PLN';$('c-hint').style.color='var(--warn)';return}
    if(!S.currencies.includes(c)){S.currencies.push(c);if(!RATES[c])RATES[c]=0}save();render()};
  if($('sv-go'))$('sv-go').onclick=()=>{const v=parseFloat(($('sv').value||'').replace(',','.'));if(!isFinite(v))return;const diff=r2(v-budget().balance);
    if(diff===0){$('sv-h').textContent='Всё сходится, корректировка не нужна';return}
    S.tx.push({id:nid(),kind:diff>0?'income':'expense',amt:Math.abs(diff),cur:'USD',cat:'Прочее',d:S.today,note:'Сверка'});save();render();toast(`Корректировка ${diff>0?'+':'−'}${money(Math.abs(diff))}`)};
  /* categories */
  on('[data-cnew]',()=>{S.catNew={kind:'expense',name:'',color:CAT_COLORS[2],icon:'tag'};save();softRender();setTimeout(()=>$('cn-name')&&$('cn-name').focus(),50)});
  on('[data-ccancel]',()=>{S.catNew=null;save();softRender()});
  if($('cn-name'))$('cn-name').addEventListener('input',e=>{S.catNew.name=e.target.value;save()});
  on('[data-ckind]',el=>{S.catNew.kind=el.dataset.ckind;save();segSelect(el.parentElement,[...el.parentElement.querySelectorAll('button')].indexOf(el))});
  on('[data-ccol]',el=>{S.catNew.color=el.dataset.ccol;save();document.querySelectorAll('[data-ccol]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));document.querySelectorAll('.icgrid .ic').forEach(i=>i.style.setProperty('--c',S.catNew.color))});
  on('[data-cic]',el=>{S.catNew.icon=el.dataset.cic;save();document.querySelectorAll('[data-cic]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)))});
  if($('cn-save'))$('cn-save').onclick=()=>{const n=S.catNew,name=cap(n.name.trim());
    if(!name){$('cn-err').textContent='Впиши название';return}
    if(S.cats.some(c=>c.name.toLowerCase()===name.toLowerCase())){$('cn-err').textContent=S.cats.find(c=>c.name.toLowerCase()===name.toLowerCase()).archived?'Такая категория есть в архиве — верни её оттуда':'Такая категория уже есть';return}
    S.cats.push({name,kind:n.kind,archived:false,color:n.color,icon:n.icon});S.catNew=null;save();render();toast(`Категория «${name}» добавлена`)};
  on('[data-demo-cls]',el=>{document.documentElement.classList.toggle(el.dataset.demoCls);toast(document.documentElement.classList.contains(el.dataset.demoCls)?'Включено':'Выключено')});
  if($('bigtext'))$('bigtext').onclick=()=>{const big=getComputedStyle(document.documentElement).getPropertyValue('--ts').trim()!=='1.2';document.documentElement.style.setProperty('--ts',big?'1.2':'1');render();toast(big?'Текст крупнее, как в настройках iPhone':'Обычный размер текста')};
  {const dn=document.querySelector('#screen .donut');if(dn){const rows=[...dn.querySelectorAll('.lrow')];
    const set=(i,dim)=>{const r=rows[i];if(!r||!r.isConnected||!$('dc-pct'))return;dn.classList.toggle('hl',!!dim);dn.querySelectorAll('.arc').forEach(a=>a.classList.toggle('on',!!dim&&a.dataset.arc==i));rows.forEach(p=>p.classList.toggle('on',!!dim&&p===r));
      const c=$('dc-pct');c.textContent=r.dataset.pct+'%';c.style.color=r.style.getPropertyValue('--c');$('dc-name').textContent=r.dataset.name;$('dc-val').textContent=r.dataset.val};
    rows.forEach((r,i)=>{r.onmouseenter=()=>set(i,true);r.onfocus=()=>set(i,true);r.onclick=()=>openRecords(r.dataset.name,'report')});
    dn.querySelectorAll('.arc').forEach(a=>{a.style.cursor='pointer';a.onmouseenter=()=>set(+a.dataset.arc,true);a.onclick=()=>{const r=rows[+a.dataset.arc];if(r)openRecords(r.dataset.name,'report')}});
    dn.onmouseleave=()=>set(0,false)}}
  on('[data-repwho]',el=>{S.repWho=el.dataset.repwho;save();render()});
  if($('p-name'))$('p-name').addEventListener('change',e=>{S.partner.name=cap(e.target.value.trim())||'Она';save();render()});
  if($('partnerdemo'))$('partnerdemo').onclick=()=>{const t={id:nid(),kind:'expense',d:S.today,amt:30,cur:'USD',cat:'Кафе и рестораны',note:'кафе',by:'partner'};S.tx.push(t);S.lastAdded=t.id;save();render();
    const b=budget();toast(`<span class="tg"><small>Telegram · Seafarer Budget</small>${esc(pName())}: Кафе и рестораны · $30${b.left===undefined?'':b.left>=0?' · на сегодня осталось '+money(b.left):' · перерасход за сегодня '+money(-b.left)}</span>`)};
  on('[data-catarch1]',el=>{const c=S.cats.find(x=>x.name===el.dataset.catarch1);c.archived=true;save();render();toast('Категория в архиве','Отменить',()=>{c.archived=false;save();render()})});
  on('[data-catdel1]',el=>{deleteCat(el.dataset.catdel1);save();render()});
  on('[data-swarch]',el=>{const c=S.cats.find(x=>x.name===el.dataset.swarch);collapseRow(el.closest('.swipe'),()=>{c.archived=true;save();softRender();toast('Категория в архиве','Отменить',()=>{c.archived=false;save();softRender()})})});
  on('[data-swcdel]',el=>{const n=el.dataset.swcdel;collapseRow(el.closest('.swipe'),()=>{deleteCat(n);save();softRender()})});
  /* archive */
  on('[data-accop]',el=>{S.accOp=el.dataset.accop;save();softRender()});
  {const xr=()=>{const a=parseFloat(($('x-a')||{}).value||''),b=parseFloat(($('x-b')||{}).value||''),fa=($('x-ac')||{}).value,fb=($('x-bc')||{}).value,out=$('x-rate');if(!out)return;
      if(!(a>0&&b>0)||!fa||!fb||fa===fb){out.textContent='Курс появится, когда впишешь обе суммы';return}
      const mine=a/b,nbu=RATES[fb]/RATES[fa],d=(mine/nbu-1)*100;
      out.innerHTML=`1 ${fb} = <b>${mine.toFixed(2)} ${fa}</b> · НБУ ${nbu.toFixed(2)} · ${Math.abs(d)<0.05?'как у НБУ':(d>0?'на ':'на ')+Math.abs(d).toFixed(1)+'% '+(d>0?'дороже':'дешевле')}`};
    ['x-a','x-b'].forEach(id=>{const i=$(id);if(i)i.addEventListener('input',xr)});['x-ac','x-bc'].forEach(id=>{const i=$(id);if(i)i.addEventListener('change',xr)})}
  on('[data-accarch]',el=>{const n=el.dataset.accarch;S.accArch=[...(S.accArch||[]),n];save();softRender();toast('Счёт в архиве','Отменить',()=>{S.accArch=S.accArch.filter(x=>x!==n);save();softRender()})});
  on('[data-arback]',el=>{const [t,...r]=el.dataset.arback.split(':'),k=r.join(':');
    if(t==='t'){const x=S.tx.find(q=>q.id===k);if(x)x.archived=false}else if(t==='g')S.goals.find(g=>g.id===k).archived=false;else if(t==='c')S.cats.find(c=>c.name===k).archived=false;else S.accArch=S.accArch.filter(x=>x!==k);
    S.arDel=null;save();softRender();toast(t==='t'?'Запись вернулась':t==='g'?'Цель вернулась':t==='c'?'Категория вернулась':'Счёт вернулся')});
  on('[data-ardel]',el=>{S.arDel=el.dataset.ardel;save();softRender()});
  on('[data-ardelno]',()=>{S.arDel=null;save();softRender()});
  on('[data-ardel2]',el=>{const [t,...r]=el.dataset.ardel2.split(':'),k=r.join(':');
    if(t==='t'){const i=S.tx.findIndex(q=>q.id===k),x=S.tx[i];S.tx.splice(i,1);S.arDel=null;save();softRender();toast('Запись удалена','Отменить',()=>{S.tx.splice(i,0,x);save();softRender()})}
    else if(t==='g'){const i=S.goals.findIndex(g=>g.id===k),g=S.goals[i];S.goals.splice(i,1);S.arDel=null;save();softRender();toast('Цель удалена','Отменить',()=>{S.goals.splice(i,0,g);save();softRender()})}
    else if(t==='c'){deleteCat(k);S.arDel=null;save();softRender()}
    else{S.accDel=[...(S.accDel||[]),k];S.arDel=null;save();softRender();toast('Счёт удалён','Отменить',()=>{S.accDel=S.accDel.filter(x=>x!==k);save();softRender()})}});
  on('[data-demo-save]',()=>toast('В прототипе не сохраняется'));
  on('[data-pick],[data-gp]',el=>openPicker(el));
  on('[data-wz]',el=>{S.wz=+el.dataset.wz;save();render()});
  bindWipe();
  document.querySelectorAll('#wzCurs .wzrow').forEach(bindWzRow);on('[data-wzadd]',()=>wzAddCur());
  on('[data-wzmode]',el=>{S.mode=el.dataset.wzmode;save();document.querySelectorAll('[data-wzmode]').forEach(b=>b.setAttribute('aria-checked',String(b===el)))});
  document.querySelectorAll('[data-wzmode]').forEach(b=>b.ondblclick=()=>{S.wz=2;save();render()});
  {const lf=$('auLogin');if(lf){lf.onsubmit=e=>{e.preventDefault();go('home')};const e1=$('lg-e');if(e1)setTimeout(()=>e1.focus(),0)}}
  on('[data-eye]',el=>{const i=$('lg-p'),show=i.type==='password';i.type=show?'text':'password';el.setAttribute('aria-pressed',String(show));el.title=show?'Скрыть пароль':'Показать пароль';el.setAttribute('aria-label',el.title);el.innerHTML=svg(show?AU_I.eyeOff:AU_I.eye,1.8)});
  if(document.documentElement.classList.contains('dauth')&&S.view==='wizard')document.querySelectorAll('#screen .au-form input:not(#wzCurs input)').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const p=document.querySelector('#screen .au-primary');if(p)p.click()}});
}
render();
</script>
